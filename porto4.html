<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --accent-color: #4a90e2; }
        body { font-family: 'Roboto Mono', monospace; background-color: #000; color: #e0e0e0; overflow: hidden; user-select: none; cursor: default; }

        /* --- BOOT SEQUENCE --- */
        #boot-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000;
            z-index: 10000; display: block; font-family: 'VT323', monospace; color: #0f0; padding: 20px; font-size: 1.2rem;
            white-space: pre; overflow: hidden;
        }

        /* --- DESKTOP ENVIRONMENT --- */
        #desktop {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://www.kali.org/images/wallpapers/kali-dragon-1920x1080.png') no-repeat center center;
            background-size: cover; display: none; /* Initially hidden */
        }
        
        #top-bar, #dock, .window-header { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(8px); }
        #top-bar { position: absolute; top: 0; left: 0; right: 0; height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-size: 14px; z-index: 1000; border-bottom: 1px solid #2a2a2a; }
        #dock { position: absolute; left: 0; top: 30px; bottom: 0; width: 60px; border-right: 1px solid #2a2a2a; padding-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 25px; z-index: 999; }
        .dock-icon { width: 40px; height: 40px; cursor: pointer; transition: all 0.2s ease; font-size: 30px; display:grid; place-items:center; }
        .dock-icon:hover { transform: scale(1.15); filter: drop-shadow(0 0 5px var(--accent-color)); }

        .window {
            position: absolute; display: none; resize: both; overflow: hidden; background: rgba(28, 28, 28, 0.75);
            border: 1px solid #444; border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            min-width: 350px; min-height: 200px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 100;
        }
        .window-header { height: 30px; cursor: move; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 14px; border-bottom: 1px solid #444; font-weight: bold; }
        .window-controls span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-left: 8px; cursor: pointer; }
        .close-btn { background-color: #ff5f56; }
        .min-btn { background-color: #ffbd2e; }
        .max-btn { background-color: #27c93f; }
        .window-body { padding: 15px; height: calc(100% - 30px); overflow-y: auto; }
        
        /* -- APPS -- */
        #terminal-body, #code-editor-main, #sys-monitor-body { background-color: rgba(0, 0, 0, 0.6); font-family: 'Roboto Mono', monospace; }
        #terminal-output { color: #00ff41; white-space: pre-wrap; word-wrap: break-word; }
        #terminal-input { background: transparent; border: none; color: #00ff41; flex-grow: 1; outline: none; }
        .cursor { display: inline-block; width: 8px; height: 1.2em; background: #00ff41; animation: blink 1s step-end infinite; }
        @keyframes blink { from, to { background: transparent } 50% { background: #00ff41 } }

        /* Code Editor Styles */
        #code-editor-body { display: flex; height: 100%; padding:0; }
        #file-browser { width: 180px; background: rgba(10,10,10,0.3); border-right:1px solid #444; padding:10px; flex-shrink: 0; }
        #file-browser .file-item { cursor: pointer; padding: 5px; border-radius: 3px; }
        #file-browser .file-item:hover { background: var(--accent-color); }
        #code-editor-main { flex-grow: 1; padding: 15px; overflow-y:auto; white-space:pre;}
        .code-keyword { color: #cc7832; } .code-string { color: #6a8759; } .code-function { color: #ffc66d; } .code-comment { color: #808080; }

        /* System Monitor Styles */
        .process-bar-bg { background-color: #333; height:1rem; width:100px; border-radius:3px; }
        .process-bar { background-color: #4a90e2; height:100%; transition: width 0.3s ease; border-radius:3px; }
    </style>
</head>
